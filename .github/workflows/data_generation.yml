name: Data Generation and Upload Workflow

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD). Leave empty to auto-detect from watermark.'
        required: false
        default: ''
      days_to_generate:
        description: 'Number of days of data to generate'
        required: false
        default: '1'

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.5.1 delta-spark==3.1.0 pandas huggingface_hub

      - name: Install Hugging Face CLI (hf)
        run: |
          curl -fsSL https://hf.co/cli/install.sh | bash

      - name: Create data directories
        run: |
          mkdir -p data/batch/raw
          mkdir -p data/batch/bronze
          mkdir -p data/real_time


      - name: Check Watermark
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            python scripts/manage_watermark.py --action check --input-date "${{ github.event.inputs.start_date }}" --days "${{ github.event.inputs.days_to_generate || '1' }}"
          else
            python scripts/manage_watermark.py --action check --days "${{ github.event.inputs.days_to_generate || '1' }}"
          fi

      - name: Generate Raw JSON Data
        run: |
          python scripts/generate_batch_data.py \
            --output-dir data/batch/raw \
            --start-date $TARGET_DATE \
            --days ${{ github.event.inputs.days_to_generate || '1' }} \
            --seed $(date -d $TARGET_DATE +%s)

      - name: Convert Raw JSON to Delta Format (Bronze)
        if: success()
        env:
          HF_S3_ACCESS_KEY: ${{ secrets.HF_S3_ACCESS_KEY }}
          HF_S3_SECRET_KEY: ${{ secrets.HF_S3_SECRET_KEY }}
        run: |
          python scripts/convert_to_delta.py \
            --input-dir data/batch/raw \
            --output-dir s3a://buckets/aayushbhat26/hvac_application_poc_bucket/batch/bronze

      - name: Process Bronze to Staging
        if: success()
        env:
          HF_S3_ACCESS_KEY: ${{ secrets.HF_S3_ACCESS_KEY }}
          HF_S3_SECRET_KEY: ${{ secrets.HF_S3_SECRET_KEY }}
        run: |
          python scripts/bronze_to_staging.py \
            --input-dir s3a://buckets/aayushbhat26/hvac_application_poc_bucket/batch/bronze \
            --output-dir s3a://buckets/aayushbhat26/hvac_application_poc_bucket/batch/staging \
            --start-date $TARGET_DATE \
            --end-date $END_DATE

      - name: Process Staging to Silver
        if: success()
        env:
          HF_S3_ACCESS_KEY: ${{ secrets.HF_S3_ACCESS_KEY }}
          HF_S3_SECRET_KEY: ${{ secrets.HF_S3_SECRET_KEY }}
        run: |
          python scripts/staging_to_silver.py \
            --input-dir s3a://buckets/aayushbhat26/hvac_application_poc_bucket/batch/staging \
            --output-dir s3a://buckets/aayushbhat26/hvac_application_poc_bucket/batch/silver \
            --start-date $TARGET_DATE \
            --end-date $END_DATE

      - name: Process Silver to Gold (Dimensions & Facts)
        if: success()
        env:
          HF_S3_ACCESS_KEY: ${{ secrets.HF_S3_ACCESS_KEY }}
          HF_S3_SECRET_KEY: ${{ secrets.HF_S3_SECRET_KEY }}
        run: |
          python scripts/silver_to_gold.py \
            --input-dir s3a://buckets/aayushbhat26/hvac_application_poc_bucket/batch/silver \
            --output-dir s3a://buckets/aayushbhat26/hvac_application_poc_bucket/batch/gold \
            --start-date $TARGET_DATE \
            --end-date $END_DATE

      - name: Upload Raw Data and Real Time to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf sync ./data/batch/raw hf://buckets/aayushbhat26/hvac_application_poc_bucket/batch/raw
          hf sync ./data/real_time hf://buckets/aayushbhat26/hvac_application_poc_bucket/real_time

      - name: Update Watermark on Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/manage_watermark.py --action update --date $END_DATE --start-date $TARGET_DATE --days $GENERATED_DAYS
