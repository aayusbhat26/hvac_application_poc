name: Data Generation and Upload Workflow

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD). Leave empty to auto-detect from watermark.'
        required: false
        default: ''
      days_to_generate:
        description: 'Number of days of data to generate'
        required: false
        default: '1'

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas deltalake pyarrow huggingface_hub

      - name: Install Hugging Face CLI (hf)
        run: |
          curl -fsSL https://hf.co/cli/install.sh | bash

      - name: Create data directories
        run: |
          mkdir -p data/batch/raw
          mkdir -p data/batch/bronze
          mkdir -p data/real\ time

      - name: Check Watermark
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            python scripts/manage_watermark.py --action check --input-date "${{ github.event.inputs.start_date }}"
          else
            python scripts/manage_watermark.py --action check
          fi

      - name: Generate Raw JSON Data
        run: |
          python scripts/generate_batch_data.py \
            --output-dir data/batch/raw \
            --start-date $TARGET_DATE \
            --days ${{ github.event.inputs.days_to_generate || '1' }}

      - name: Convert Raw JSON to Delta Format (Bronze)
        run: |
          python scripts/convert_to_delta.py \
            --input-dir data/batch/raw \
            --output-dir data/batch/bronze

      - name: Update Watermark Locally
        run: |
          python scripts/manage_watermark.py --action update --date $TARGET_DATE

      - name: Upload to Hugging Face Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Sync the data folder to the specified HF Bucket
          # Make sure HF_TOKEN is set as a repository secret in GitHub
          hf sync ./data hf://buckets/aayushbhat26/hvac_application_poc_bucket
